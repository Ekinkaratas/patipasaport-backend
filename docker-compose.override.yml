# ============================================================
# docker-compose.override.yml  —  SADECE GELİŞTİRME ORTAMI İÇİN
# ============================================================

services:

  # ---- Altyapi: host portları (sadece localhost'a bağlı) ----
  postgres-auth:
    ports: ["127.0.0.1:5433:5432"]
  postgres-users:
    ports: ["127.0.0.1:5434:5432"]
  postgres-clinics:
    ports: ["127.0.0.1:5435:5432"]
  postgres-access:
    ports: ["127.0.0.1:5436:5432"]
  postgres-medical-record:
    ports: ["127.0.0.1:5437:5432"]
  postgres-pets:
    ports: ["127.0.0.1:5438:5432"]
  redis-access:
    ports: ["127.0.0.1:6379:6379"]
  redis-auth:
    ports: ["127.0.0.1:6380:6379"]
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"      # AMQP
      - "127.0.0.1:15672:15672"    # Management UI -> http://localhost:15672

  # ---- gRPC servisleri: grpcurl / Postman ile doğrudan test için ----
  access:
    ports: ["127.0.0.1:3001:3001"]
  auth:
    ports: ["127.0.0.1:3002:3002"]
  clinics:
    ports: ["127.0.0.1:3003:3003"]
  medical-record:
    ports: ["127.0.0.1:3004:3004"]
  pets:
    ports: ["127.0.0.1:3005:3005"]
  users:
    ports: ["127.0.0.1:3006:3006"]
