# ============================================================
# docker-compose.override.yml
# SADECE GELISTIRME ORTAMI ICIN.
#
# docker-compose.yml zaten prod-guvenli halde (sadece gateway disari
# acik). Bu dosya, "docker compose" komutu ayni klasorde calistirildiginda
# Compose tarafindan OTOMATIK olarak docker-compose.yml'in UZERINE
# bindirilir (docker-compose.yml + docker-compose.override.yml birlesir).
# Yani gelistirirken hicbir ekstra flag gerekmez:
#
#   docker compose up -d
#   -> hem app servisleri hem de burada acilan DB portlari calisir
#
# CANLIYA ALIRKEN (veya bu override'i devre disi birakmak icin):
#   1) En temizi: bu dosyayi o ortamda hic BULUNDURMAYIN
#      (repo'dan cekilen sunucuda dosyayi silin/kopyalamayin), YA DA
#   2) Override'i yoksayip sadece ana dosyayi kullanin:
#      docker compose -f docker-compose.yml up -d
#
# Onerilir: bu dosyayi .gitignore'a ekleyip sadece kendi makinenizde
# tutun, boylece "yanlislikla" prod sunucusuna tasinma riski sifira iner.
# ============================================================

services:

  postgres-auth:
    ports:
      - "5433:5432"

  postgres-users:
    ports:
      - "5434:5432"

  postgres-clinic:
    ports:
      - "5435:5432"

  postgres-access:
    ports:
      - "5436:5432"

  postgres-medical-record:
    ports:
      - "5437:5432"

  mongo-pets:
    ports:
      - "27017:27017"

  redis-access:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (tarayicidan: http://localhost:15672)

