syntax = "proto3";

package events;

import "medical_record/medical_record.proto";

message DocumentUploaded {
  string document_id = 1;
  string pet_id = 2;
  string clinic_id = 3;
  string storage_path = 4;
  string mime_type = 5;
  int32 size_bytes = 6;
  string sha256 = 7;
}

message DocumentProcessingStarted {
  string document_id = 1;
  string model_version = 2;
  string started_at = 3;
}

message DocumentAnalyzed {
  string document_id = 1;
  string model_version = 2;
  double confidence = 3;
  medical_record.RecordContent proposal = 4;
  string analyzed_at = 5;
}

message DocumentAnalysisFailed {
  string document_id = 1;
  string model_version = 2;
  string error_code = 3;
  string error_message = 4;
  string failed_at = 5;
}

message LabExplanationRequested {
  string record_id = 1;
  string title = 2;
  string sampled_at = 3;
  string species = 4;
  string birth_date = 5;
  bool is_birth_date_estimated = 6;
  repeated medical_record.LabResultItem items = 7;
}

message LabExplanationGenerated {
  string record_id = 1;
  string model_version = 2;
  double confidence = 3;
  medical_record.LabExplanation explanation = 4;
  string generated_at = 5;
}

message LabExplanationFailed {
  string record_id = 1;
  string model_version = 2;
  string error_code = 3;
  string error_message = 4;
  string failed_at = 5;
}
