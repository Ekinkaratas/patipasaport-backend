syntax = "proto3";

package pets;

service PetsService {
  rpc GetPet (GetPetRequest) returns (PetResponse);
  rpc GetPetByChipNumber (GetPetByChipNumberRequest) returns (PetResponse);
  rpc GetPetOwner (GetPetOwnerRequest) returns (GetPetOwnerResponse);
  rpc CreatePet (CreatePetRequest) returns (PetResponse);
  rpc UpdatePet (UpdatePetRequest) returns (PetResponse);
}

enum PetSex {
  PET_SEX_UNSPECIFIED = 0;
  MALE = 1;
  FEMALE = 2;
}

message Pet {
  string id = 1;                  
  string name = 2;
  string species = 3;             
  string breed = 4;
  PetSex sex = 5;
  string birth_date = 6;          // ISO-8601 (tarih)
  bool is_neutered = 7;
  string owner_user_id = 8;       // sadece referans — iletişim Users'ta

  // ÇİP NUMARASI İKİ AYRI ALAN OLARAK TAŞINIR.
  // Tek alan bazen maskeli bazen açık döner
  string chip_number_masked = 9;  // her zaman dolu — "****1234"
  string chip_number = 10;        // 'chip_number_read' scope'u yoksa BOŞ

  string created_at = 11;         // ISO-8601
  string updated_at = 12;         // ISO-8601
}

message GetPetRequest {
  string id = 1;
}

// AES-256 ile şifrelenmiş kolonda doğrudan arama yapılamaz;
// sorgu HMAC-SHA256 blind index üzerinden yürür.
message GetPetByChipNumberRequest {
  string chip_number = 1;         // düz metin gelir, serviste indekslenir
}

message GetPetOwnerRequest {
  string pet_id = 1;
}

message GetPetOwnerResponse {
  string pet_id = 1;
  string owner_user_id = 2;
}

message CreatePetRequest {
  string name = 1;
  string species = 2;
  string breed = 3;
  PetSex sex = 4;
  string birth_date = 5;
  bool is_neutered = 6;
  string chip_number = 7;         // düz metin gelir, serviste şifrelenir
  string owner_user_id = 8;       // hasta sahibi kendi adına kaydediyorsa servis bunu JWT ile karşılaştırır
}

message UpdatePetRequest {
  string id = 1;
  optional string name = 2;
  optional string breed = 3;
  optional string birth_date = 4;
  optional bool is_neutered = 5;
  optional string chip_number = 6;
}

message PetResponse {
  Pet pet = 1;
}
