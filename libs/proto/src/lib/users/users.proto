syntax = "proto3";

package users;


//   GetMe                 -> kendi verisi, tam, scope'suz
//   GetUserContact        -> ÜÇÜNCÜ TARAF iletişim bilgisi, scope zorunlu
//   ListUsersByClinic     -> yalnızca kendi kliniğinin personeli
//   GetUserDisplayNames   -> yalnızca görünen ad, elde id varsa
service UsersService {
  // Sadece Auth Service çağırır (Register akışının 1. adımı — email ve
  // telefon çakışmaları credentials yazılmadan önce burada yakalanır).
  rpc CreateUser (CreateUserRequest) returns (UserResponse);

  // Sadece Auth Service çağırır. 
  // Hesap kapatma / devre dışı bırakma için KULLANILMAZ
  // o is_active ile yapılır.
  rpc DeleteUser (UserFindByIdRequest) returns (DeleteUserResponse);

  // Kullanıcının KENDİ profili. Kimlik JWT'den okunur, request boş.
  // Tam profil döner — kendi verisi olduğu için scope gerekmez.
  rpc GetMe (GetMeRequest) returns (GetMeResponse);

  // Kullanıcının KENDİ profilini güncellemesi. id yok — JWT'den okunur.
  rpc UpdateMe (UpdateMeRequest) returns (UserResponse);

  // Diğer servisler çağırır: "bu kullanıcı kim, hangi rolde?"
  rpc GetUserRole (UserFindByIdRequest) returns (GetUserRoleResponse);

  // Sadece Auth Service çağırır (Login).
  // Token üretimi için gereken rol/klinik bilgisini ve hesabın aktif olup olmadığını tek çağrıda döner.
  // Kullanıcı yoksa NOT_FOUND.
  rpc GetUserAuthInfo (UserFindByIdRequest) returns (GetUserAuthInfoResponse);

  // Elde TUTULAN user_id'lerin görünen adını çözer.tam profil döndürmez, yalnızca ad ve rol.
  // Kullanım yeri: bir tıbbi kayıtta author_user_id var, ekranda
  // "Dr. Mehmet Yılmaz girdi" yazması gerekiyor. Sadece isim için
  // 'owner_contact_read' scope'u istemek yanlış olurdu.
  //
  // ÇOĞUL olması bilinçli: 20 kayıtlık bir liste tekil RPC ile 20 gRPC
  // çağrısı demekti (N+1). Tek elemanlı dizi göndermek tekil ihtiyacı
  // da karşılar.
  rpc GetUserDisplayNames (GetUserDisplayNamesRequest) returns (GetUserDisplayNamesResponse);

  // BAŞKA bir kullanıcının iletişim bilgisi — 'owner_contact_read'
  // scope'u KOŞULSUZ gerektirir.
  // burada sahiplik karşılaştırmasına (requester == target) gerek yok;
  rpc GetUserContact (GetUserContactRequest) returns (GetUserContactResponse);
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  CLINIC = 1;
  PET_OWNER = 2;

  reserved 3;
  reserved "STAFF";
}

// Liste ve genel yanıtlarda kullanılan YALIN kullanıcı görünümü.
message User {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;
  UserRole role = 5;
  string clinic_id = 6;  // eğer user bir klinik hesabı değilse burası boş string döner
  bool is_active = 7;
  string created_at = 8;     // ISO-8601
  string updated_at = 9;     // ISO-8601
}


message UserFindByIdRequest {
  string user_id = 1;
}

// Sadece Auth Service çağırır.
// Auth Service'in ürettiği id ile birebir aynı olmalı.
//
// role ve clinic_id KASITLI OLARAK YOK — bu RPC yalnızca PET_OWNER
// üretir, rolü servis kendi atar. Klinik hesapları davet
// akışında AYRI bir RPC ile açılacak; role'ü buraya geri eklemek davet
// doğrulamasını atlatılabilir hale getirir. reserved satırı numaraların
// başka bir anlamla geri kullanılmasını engeller.
message CreateUserRequest {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;

  reserved 5, 6;
}

message DeleteUserResponse {
  bool deleted = 1;
}

// Boş mesaj — kimlik JWT'den(JWT metadata içerisindedir) okunur, istemci kendi id'sini SÖYLEMEZ.
message GetMeRequest {}

// Kendi verisi olduğu için tam profil.
//
// Adres alanları kaldırıldı (kullanıcı adresi tutulmuyor); numaralar ve
// adlar başka bir anlamla geri kullanılmasın diye reserved.
message GetMeResponse {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;
  UserRole role = 5;
  string clinic_id = 6;      // eğer user bir klinik hesabı değilse burası boş string döner
  bool is_active = 7;
  string created_at = 11;    // ISO-8601
  string updated_at = 12;    // ISO-8601

  reserved 8, 9, 10;
  reserved "address_line", "city", "district";
}

// PATCH semantiği: 'optional' field presence sağlar, böylece
// "boş gönderildi" ile "hiç gönderilmedi" ayırt edilir.
//
// id YOK — JWT'den okunur. 
message UpdateMeRequest {
  optional string full_name = 1;
  optional string phone = 2;

  reserved 3, 4, 5;
  reserved "address_line", "city", "district";
}

message GetUserRoleResponse {
  string user_id = 1;
  UserRole role = 2;
  string clinic_id = 3;      // eğer user bir klinik hesabı değilse burası boş string döner
}

// Yalnızca token üretimi ve giriş kararı için gereken alanlar.
message GetUserAuthInfoResponse {
  string user_id = 1;
  UserRole role = 2;
  string clinic_id = 3;      // eğer user bir klinik hesabı değilse burası boş string döner
  bool is_active = 4;        // false ise Login reddedilir
}

message GetUserDisplayNamesRequest {
  // Servis tarafında ÜST SINIR uygulanmalı (50 önerilir).
  repeated string user_ids = 1;
}

// Yalnızca görünen ad ve rol. Buraya alan eklenmicek — mesajın adı
// ne döndüğünü taahhüt ediyor
//
// role dahil çünkü arayüz "Dr." önekini buna göre koyuyor.
message UserDisplayName {
  string user_id = 1;
  string full_name = 2;
  UserRole role = 3;
}

message GetUserDisplayNamesResponse {
  repeated UserDisplayName users = 1;
  repeated string not_found_ids = 2;
}

message GetUserContactRequest {
  string user_id = 1;
  string pet_id = 2;
}

message GetUserContactResponse {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
  string email = 4;

  reserved 5, 6, 7;
  reserved "address_line", "city", "district";
}

message UserResponse {
  User user = 1;
}
