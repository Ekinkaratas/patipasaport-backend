syntax = "proto3";

package clinics;

// Klinik profili, stok/envanter takibi ve frontend orkestrasyonu (BFF).
//
// ZERO TRUST NOTU: Clinic Service'in "izinli" demesi alt servisler için
// yeterli DEĞİL. Aldığı JWT'yi alt servislere aynen relay eder; onlar da
// kendi CheckAccess kontrollerini yapar. 
service ClinicsService {
  rpc GetClinic (GetClinicRequest) returns (ClinicResponse);
  rpc CreateClinic (CreateClinicRequest) returns (ClinicResponse);
  rpc DeactivateClinic (DeactivateClinicRequest) returns (ClinicResponse);
  rpc ListStockItems (ListStockItemsRequest) returns (ListStockItemsResponse);
  rpc AddStockItem (AddStockItemRequest) returns (StockItemResponse);
  rpc UpdateStockItem (UpdateStockItemRequest) returns (StockItemResponse);
  rpc AdjustStockItem (AdjustStockItemRequest) returns (StockItemResponse);
  rpc DeleteStockItem (DeleteStockItemRequest) returns (StockItemResponse);
  rpc CreateStockSale (CreateStockSaleRequest) returns (StockSaleResponse);
  rpc ListStockSales (ListStockSalesRequest) returns (ListStockSalesResponse);
  rpc CancelStockSale (CancelStockSaleRequest) returns (StockSaleResponse);
  rpc GetStockSalesSummary (GetStockSalesSummaryRequest) returns (StockSalesSummaryResponse);
  rpc GetClinicPetOverview (GetClinicPetOverviewRequest) returns (GetClinicPetOverviewResponse);
  rpc UploadPetResult (UploadPetResultRequest) returns (UploadPetResultResponse);
}

message Clinic {
  string id = 1;
  string name = 2;
  string tax_number = 3;
  string phone = 4;
  string email = 5;
  bool is_active = 10;
  string created_at = 11;     // ISO-8601
  string updated_at = 12;     // ISO-8601

  reserved 6, 7, 8, 9;
  reserved "address_line", "city", "district", "working_hours";
}

message GetClinicRequest {
  string id = 1;
}

message CreateClinicRequest {
  string name = 1;
  string tax_number = 2;
  string phone = 3;
  string email = 4;
  string password = 5;
}

message DeactivateClinicRequest {
  string clinic_id = 1;
}

message ClinicResponse {
  Clinic clinic = 1;
}

// ---------- Stok / Envanter ----------

message StockItem {
  string id = 1;
  string clinic_id = 2;
  string name = 3;
  string category = 4;        // "aşı", "ilaç", "sarf"
  string unit = 5;            // "adet", "ml", "kutu"
  int32 quantity = 6;
  int32 critical_level = 7;   // altına düşünce uyarı
  bool is_below_critical = 8;
  string expires_at = 9;      // ISO-8601, yoksa boş string
  string updated_at = 10;     // ISO-8601
  optional int32 purchase_price = 11;
  optional int32 sale_price = 12;
}

message ListStockItemsRequest {
  string clinic_id = 1;
  optional string category = 2;
  optional bool only_below_critical = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListStockItemsResponse {
  repeated StockItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Kaydı kimin girdiği JWT'den okunur, istemciden alınmaz.
message AddStockItemRequest {
  string clinic_id = 1;
  string name = 2;
  string category = 3;
  string unit = 4;
  int32 quantity = 5;
  int32 critical_level = 6;
  string expires_at = 7;
  int32 purchase_price = 8;
  int32 sale_price = 9;
}

message StockItemResponse {
  StockItem item = 1;
}

message UpdateStockItemRequest {
  string clinic_id = 1;
  string item_id = 2;
  optional string name = 3;
  optional int32 quantity = 4;
  optional int32 critical_level = 5;
  optional string expires_at = 6;
  optional int32 purchase_price = 7;
  optional int32 sale_price = 8;
}

message AdjustStockItemRequest {
  string clinic_id = 1;
  string item_id = 2;
  int32 delta = 3;
}

message DeleteStockItemRequest {
  string clinic_id = 1;
  string item_id = 2;
}

message StockSale {
  string id = 1;
  string clinic_id = 2;
  string stock_item_id = 3;
  string item_name = 4;
  string category = 5;
  string unit = 6;
  int32 quantity = 7;
  int32 unit_sale_price = 8;
  int32 unit_purchase_price = 9;
  int64 total_sale = 10;
  int64 total_cost = 11;
  int64 profit = 12;
  string sold_at = 13;
  string cancelled_at = 14;
}

message CreateStockSaleRequest {
  string clinic_id = 1;
  string item_id = 2;
  int32 quantity = 3;
  optional int32 unit_price = 4;
}

message CancelStockSaleRequest {
  string clinic_id = 1;
  string sale_id = 2;
}

message StockSaleResponse {
  StockSale sale = 1;
  StockItem item = 2;
}

message ListStockSalesRequest {
  string clinic_id = 1;
  string from_date = 2;
  string to_date = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListStockSalesResponse {
  repeated StockSale sales = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetStockSalesSummaryRequest {
  string clinic_id = 1;
  string month = 2;
}

message SalesTotals {
  int64 revenue = 1;
  int64 cost = 2;
  int64 profit = 3;
  int32 sales_count = 4;
  int64 quantity = 5;
}

message DailySales {
  string date = 1;
  int64 revenue = 2;
  int64 cost = 3;
  int64 profit = 4;
  int32 sales_count = 5;
  int64 quantity = 6;
}

message WeeklySales {
  string week_start = 1;
  string week_end = 2;
  int64 revenue = 3;
  int64 cost = 4;
  int64 profit = 5;
  int32 sales_count = 6;
  int64 quantity = 7;
}

message ProductSales {
  string stock_item_id = 1;
  string item_name = 2;
  string unit = 3;
  int64 revenue = 4;
  int64 cost = 5;
  int64 profit = 6;
  int32 sales_count = 7;
  int64 quantity = 8;
}

message StockSalesSummaryResponse {
  string month = 1;
  SalesTotals totals = 2;
  repeated DailySales daily = 3;
  repeated WeeklySales weekly = 4;
  repeated ProductSales products = 5;
}

// ---------- BFF: klinik ekranındaki hayvan özeti ----------

message GetClinicPetOverviewRequest {
  string clinic_id = 1;
  string pet_id = 2;
}

// Pets + Users + MedicalRecord servislerinden PARALEL toplanır.
// Alt mesajlar burada yeniden tanımlanır — bu servisin kendi dış
// sözleşmesidir, alt servisin iç modeli değişse bile kırılmaz.
message ClinicPetSummary {
  string pet_id = 1;
  string name = 2;
  string species = 3;
  string breed = 4;
  string birth_date = 5;
  string chip_number_masked = 6;
  string owner_user_id = 7;
}

// 'owner_contact_read' scope'u yoksa bu blok boş döner.
message ClinicOwnerSummary {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
}

message ClinicRecordSummary {
  string record_id = 1;
  string type = 2;            // VACCINATION | PRESCRIPTION | EXAMINATION
  string title = 3;
  string recorded_at = 4;     // ISO-8601
}

message GetClinicPetOverviewResponse {
  ClinicPetSummary pet = 1;
  ClinicOwnerSummary owner = 2;
  repeated ClinicRecordSummary recent_records = 3;
  int32 pending_draft_review_count = 4;
  repeated string unavailable_sources = 5;  // kısmi başarı: "medical_record"
}

// ---------- Sonuç (tahlil/görüntü) yükleme ----------

// DOSYANIN KENDİSİ BURADAN GEÇMEZ. Gateway multipart isteği alır,
// türünü dosya imzasından (file-type) doğrular, dosyayı SeaweedFS'teki
// (S3 uyumlu) özel bucket'a yazar ve sadece referansını iletir. Clinics bu çağrıyı
// medical_record.RegisterDocument'a aktarır; rıza (medical_write) orada
// kontrol edilir. Kayıt başarısız olursa gateway yalnızca bu istekte
// yüklediği dosyayı siler; önceden var olan dosyalara dokunulmaz.
// AI işlemi, outbox üzerinden RabbitMQ'ya düşen olayla başlar.
message UploadPetResultRequest {
  string clinic_id = 1; 
  string pet_id = 2;
  string storage_path = 3;    // bucket içindeki nesne anahtarı
  string original_name = 4;
  string mime_type = 5;       // "application/pdf", "image/jpeg"
  int32 size_bytes = 6;
  string note = 7;
  string sha256 = 8;
}

message UploadPetResultResponse {
  string document_id = 1;
  string uploaded_at = 4;       // ISO-8601
  string status = 5;

  reserved 2, 3;
  reserved "record_id", "ai_pipeline_queued";
}
