syntax = "proto3";

package access;


// KİMLİK ALANI KURALI: Hiçbir request mesajı "bu işlemi yapan kim"
// bilgisini taşımaz — kimlik JWT metadata'dan okunur. İstemciden gelen
// bir id ASLA kimlik olarak kabul edilmez. Ancak istemcinin yaptığı bir
// SEÇİM (hangi kliniğe izin veriyorum, hangi hayvan için) request'te
// taşınır; kural "kimlik gelmez", "hiçbir id gelmez" değil.
service AccessService {
  // SADECE Auth Service çağırır. Auth kullanıcıyı doğruladıktan sonra
  // kimliğini buraya emanet eder; opaque token'ı Access üretir ve kendi
  // store'unda tutar. Auth ürettiği token'ı istemciye access_token olarak
  // geri verir.
  rpc CreateToken (CreateTokenRequest) returns (CreateTokenResponse);

  // SADECE Auth Service çağırır. Logout ve refresh rotasyonunda eski opaque token'ı geçersiz kılar.
  rpc RevokeToken (RevokeTokenRequest) returns (RevokeTokenResponse);

  // Sadece Gateway çağırır. Opaque token -> kısa ömürlü imzalı JWT.
  // İÇ RPC: HTTP endpoint'i yok, ValidationPipe devreye girmez.
  rpc ExchangeToken (ExchangeTokenRequest) returns (ExchangeTokenResponse);

  // Alt servisler çağırır. Rıza kontrolü.
  rpc CheckAccess (CheckAccessRequest) returns (CheckAccessResponse);

  // Rıza yaşam döngüsü. Gateway üzerinden hasta sahibi tetikler.
  rpc GrantConsent (GrantConsentRequest) returns (ConsentResponse);
  rpc RevokeConsent (RevokeConsentRequest) returns (ConsentResponse);
  rpc GetConsentStatus (GetConsentStatusRequest) returns (ConsentResponse);
}

enum ConsentStatus {
  CONSENT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  REVOKED = 2;
  EXPIRED = 3;
  NOT_FOUND = 4;
}

enum ClientType {
  CLIENT_TYPE_UNSPECIFIED = 0;
  WEB = 1;
  MOBILE = 2;
}

enum DeniedReason {
  DENIED_REASON_UNSPECIFIED = 0;      // allowed = true olduğunda
  DENIED_REASON_NO_CONSENT = 1;       // hiç rıza verilmemiş
  DENIED_REASON_REVOKED = 2;          // rıza iptal edilmiş
  DENIED_REASON_EXPIRED = 3;          // rıza penceresi kapanmış
  DENIED_REASON_INSUFFICIENT_SCOPE = 4; // rıza AKTİF ama istenen scope yok
}

// ---------- Token üretimi ----------

message CreateTokenRequest {
  string user_id = 1;
  string role = 2;              // VETERINARIAN | PET_OWNER | STAFF
  string clinic_id = 3;         // role PET_OWNER ise boş string
  ClientType client_type = 4;   // token'a bağlanır: ExchangeToken'da
                                // gelen client_type ile karşılaştırılır
  repeated string scopes = 5;   // token'ın taban scope'ları (rıza DEĞİL)
  int32 ttl_seconds = 6;        // 0 ise Access'in varsayılan TTL'i uygulanır
}

message CreateTokenResponse {
  string opaque_token = 1;      // istemciye access_token olarak döner;
                                // Access'te yalnızca sha256 özeti saklanır
  int32 expires_in = 2;         // saniye
  string issued_at = 3;         // ISO-8601
  string expires_at = 4;        // ISO-8601
}

// ---------- Token Revoke ----------

message RevokeTokenRequest  { string opaque_token = 1; }

message RevokeTokenResponse { bool revoked = 1; }


// ---------- Token exchange ----------

message ExchangeTokenRequest {
  string opaque_token = 1;
  ClientType client_type = 2;
}

message ExchangeTokenResponse {
  string jwt = 1;              // metadata'da 'authorization' olarak taşınır
  int32 expires_in = 2;        // saniye — kısa tutucam (60 sn)
  string trace_id = 3;         // metadata'da 'x-trace-id' olarak taşınır
  string user_id = 4;
  string role = 5;
  string clinic_id = 6;        // role PET_OWNER ise boş string
  ClientType client_type = 7;  // token'a bağlanır: Introspect'te gelen
                               // client_type ile karşılaştırılır, uyuşmazsa
                               // reddedilir. Web'den çalınan token
                               // mobilde işe yaramaz.
}

// ---------- Rıza kontrolü ----------

// Kimlik alanı YOK — çağıran servis kim olduğunu JWT'den bilir.
message CheckAccessRequest {
  string clinic_id = 1;
  string pet_id = 2;
  repeated string required_scopes = 3;
}

message CheckAccessResponse {
  bool allowed = 1;
  repeated string granted_scopes = 2;    // izin verilen scope'lar
  repeated string missing_scopes = 3;    // eksik olanlar — 403 mesajı için
  string consent_id = 4;
  ConsentStatus status = 5;
  string expires_at = 6;                 // ISO-8601
  DeniedReason denied_reason = 7;           
}

// ---------- Rıza yaşam döngüsü ----------

// owner_user_id YOK — rızayı VEREN kişinin kimliği JWT metadata'dan okunur.

message GrantConsentRequest {
  string clinic_id = 1;
  string pet_id = 2;
  repeated string scopes = 3;
  string expires_at = 4;         // ISO-8601
}

// owner_user_id YOK — JWT'den okunur.
message RevokeConsentRequest {
  string consent_id = 1;
}

message GetConsentStatusRequest {
  string clinic_id = 1;
  string pet_id = 2;
}

message ConsentResponse {
  string consent_id = 1;
  ConsentStatus status = 2;
  string owner_user_id = 3;
  string clinic_id = 4;
  string pet_id = 5;
  repeated string scopes = 6;
  string granted_at = 7;         // ISO-8601
  string expires_at = 8;         // ISO-8601
  string revoked_at = 9;         // ISO-8601, iptal edilmediyse boş string
}
