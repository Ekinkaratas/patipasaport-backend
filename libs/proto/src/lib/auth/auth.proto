syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (TokenResponse);
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (TokenResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc DeleteInCredential (DeleteInCredentialRequest) returns (DeleteInCredentialResponse);
}

enum ClientType {
  CLIENT_TYPE_UNSPECIFIED = 0;
  WEB = 1;
  MOBILE = 2;
}

// ---------- Kayıt ----------
message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
  ClientType client_type = 5;
}

// ---------- Giriş / Yenileme ----------
message LoginRequest {
  string email = 1;
  string password = 2;
  ClientType client_type = 3;
  bool remember_me = 4;           
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message DeleteInCredentialRequest {
  string user_id = 1;
}

message DeleteInCredentialResponse {
  bool deleted = 1;
}

// Register, Login ve Refresh aynı şekli döndüğü için tek mesaj.
message TokenResponse {
  string access_token = 1;   // opaque
  string refresh_token = 2;
  string token_type = 3;     // "Bearer"
  int32 expires_in = 4;      // saniye
  string user_id = 5;
}


