syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (TokenResponse);
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (TokenResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // Sadece Access Service çağırır — opaque token'ın geçerliliğini sorar.
  rpc Introspect (IntrospectRequest) returns (IntrospectResponse);
}

enum ClientType {
  CLIENT_TYPE_UNSPECIFIED = 0;
  WEB = 1;
  MOBILE = 2;
}

// ---------- Kayıt ----------
message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
  ClientType client_type = 5;
}

// ---------- Giriş / Yenileme ----------
message LoginRequest {
  string email = 1;
  string password = 2;
  ClientType client_type = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

// Register, Login ve Refresh aynı şekli döndüğü için tek mesaj.
message TokenResponse {
  string access_token = 1;   // opaque
  string refresh_token = 2;
  string token_type = 3;     // "Bearer"
  int32 expires_in = 4;      // saniye
  string user_id = 5;
}

// ---------- Introspection ----------

message IntrospectRequest {
  string token = 1;
}

message IntrospectResponse {
  bool active = 1;
  string user_id = 2;
  ClientType client_type = 3;
  string role = 4;              // VETERINARIAN | PET_OWNER | STAFF
  string clinic_id = 5;         // eğer user bir klinik personeli değilse burası boş string döner
  repeated string scopes = 6;   // token'ın taban scope'ları (rıza DEĞİL)
  string issued_at = 7;         // ISO-8601
  string expires_at = 8;        // ISO-8601
}
