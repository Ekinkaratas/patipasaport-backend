syntax = "proto3";

package medical_record;

// Tıbbi geçmiş yönetimi, dosya referansı ve klinik onaylı (human-in-the-loop) taslak akışı.
//
// Python/FastAPI servisiyle iletişim tamamen RabbitMQ üzerinden asenkrondur (outbox + CloudEvents olayları, bkz. events/events.proto).
service MedicalRecordService {
  rpc ListRecordsByPet (ListRecordsByPetRequest) returns (ListRecordsResponse);
  rpc CreateRecord (CreateRecordRequest) returns (RecordResponse);
  rpc ListVaccinations (ListVaccinationsRequest) returns (ListVaccinationsResponse);
  rpc ListPrescriptions (ListPrescriptionsRequest) returns (ListPrescriptionsResponse);
  rpc ListLabResults (ListLabResultsRequest) returns (ListLabResultsResponse);
  rpc GetLabExplanation (GetLabExplanationRequest) returns (LabExplanationResponse);

  // Hayvanın onaylı kayıtlarının tamamını AI'a değerlendirtir (Akış C).
  rpc RequestHealthAssessment (RequestHealthAssessmentRequest) returns (HealthAssessmentResponse);
  rpc GetLatestHealthAssessment (GetLatestHealthAssessmentRequest) returns (HealthAssessmentResponse);

  rpc RegisterDocument (RegisterDocumentRequest) returns (DocumentResponse);
  rpc GetDocument (GetDocumentRequest) returns (DocumentResponse);
  rpc ListDocumentsByPet (ListDocumentsByPetRequest) returns (ListDocumentsResponse);

  // Kliniğin onay bekleyen taslakları görmesi sebebiyle yazıldı.
  rpc ListDraftReviews (ListDraftReviewsRequest) returns (ListDraftReviewsResponse);
  rpc ReviewDraft (ReviewDraftRequest) returns (DraftReviewResponse);
}

enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  EXAMINATION = 1;
  VACCINATION = 2;
  PRESCRIPTION = 3;
  LAB_RESULT = 4;
  SURGERY = 5;
}

enum DraftReviewStatus {
  DRAFT_REVIEW_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  REJECTED = 3;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  QUEUED = 1;
  PROCESSING = 2;
  DRAFT_READY = 3;
  FAILED = 4;
}

enum LabResultFlag {
  LAB_RESULT_FLAG_UNSPECIFIED = 0;
  NORMAL = 1;
  LOW = 2;
  HIGH = 3;
}

enum LabExplanationStatus {
  LAB_EXPLANATION_STATUS_UNSPECIFIED = 0;
  LAB_EXPLANATION_PENDING = 1;
  LAB_EXPLANATION_READY = 2;
  LAB_EXPLANATION_FAILED = 3;
}

enum HealthAssessmentStatus {
  HEALTH_ASSESSMENT_STATUS_UNSPECIFIED = 0;
  HEALTH_ASSESSMENT_PENDING = 1;
  HEALTH_ASSESSMENT_READY = 2;
  HEALTH_ASSESSMENT_FAILED = 3;
}

enum HealthRiskLevel {
  HEALTH_RISK_LEVEL_UNSPECIFIED = 0;
  HEALTH_RISK_LOW = 1;
  HEALTH_RISK_MODERATE = 2;
  HEALTH_RISK_HIGH = 3;
  HEALTH_RISK_URGENT = 4;
}

enum LabTrend {
  LAB_TREND_UNSPECIFIED = 0;
  LAB_TREND_SINGLE = 1;
  LAB_TREND_RISING = 2;
  LAB_TREND_FALLING = 3;
  LAB_TREND_STABLE = 4;
}

enum ConditionLikelihood {
  CONDITION_LIKELIHOOD_UNSPECIFIED = 0;
  CONDITION_LIKELIHOOD_LOW = 1;
  CONDITION_LIKELIHOOD_MEDIUM = 2;
  CONDITION_LIKELIHOOD_HIGH = 3;
}

enum RecommendationCategory {
  RECOMMENDATION_CATEGORY_UNSPECIFIED = 0;
  RECOMMENDATION_NUTRITION = 1;
  RECOMMENDATION_CARE = 2;
  RECOMMENDATION_FOLLOW_UP_TEST = 3;
  RECOMMENDATION_VET_VISIT = 4;
  RECOMMENDATION_VACCINATION = 5;
}

enum VaccinationDueStatus {
  VACCINATION_DUE_STATUS_UNSPECIFIED = 0;
  VACCINATION_OVERDUE = 1;
  VACCINATION_DUE_SOON = 2;
}

// Dosya İÇERİĞİ değil, referansı taşınır.
message FileReference {
  string document_id = 1;
  string storage_path = 2;
  string original_name = 3;
  string mime_type = 4;
  int32 size_bytes = 5;
  string uploaded_at = 6;     // ISO-8601
}

message VaccinationDetails {
  string vaccine_name = 1;
  string batch_number = 2;
  string administered_at = 3;
  string next_due_at = 4;
}

message PrescriptionDetails {
  string medication_name = 1;
  string dosage = 2;
  string frequency = 3;
  int32 duration_days = 4;
  string instructions = 5;
  string prescribed_at = 6;
}

message LabResultItem {
  string test_name = 1;
  string value = 2;
  string unit = 3;
  string reference_range = 4;
  LabResultFlag flag = 5;
}

message LabResultDetails {
  repeated LabResultItem items = 1;
  string sampled_at = 2;
}

message RecordContent {
  RecordType type = 1;
  string title = 2;
  string notes = 3;
  string recorded_at = 4;
  oneof details {
    VaccinationDetails vaccination = 5;
    PrescriptionDetails prescription = 6;
    LabResultDetails lab_result = 7;
  }
}

message MedicalRecord {
  string id = 1;
  string pet_id = 2;
  string clinic_id = 3;
  RecordType type = 5;
  string title = 6;
  string notes = 7;
  string recorded_at = 8;         // ISO-8601, muayene tarihi
  repeated FileReference attachments = 9;
  string source_draft_review_id = 10;  // AI taslağından geldiyse dolu
  string created_at = 11;         // ISO-8601
  oneof details {
    VaccinationDetails vaccination = 12;
    PrescriptionDetails prescription = 13;
    LabResultDetails lab_result = 14;
  }

  reserved 4;
  reserved "author_user_id";
}

message ListRecordsByPetRequest {
  string pet_id = 1;
  optional RecordType type = 2;
  string from_date = 3;           // ISO-8601, boş ise filtre yok
  string to_date = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListRecordsResponse {
  repeated MedicalRecord records = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// clinic_id JWT'den okunur.
message CreateRecordRequest {
  string pet_id = 1;
  repeated FileReference attachments = 6;
  RecordContent content = 7;

  reserved 2, 3, 4, 5;
  reserved "type", "title", "notes", "recorded_at";
}

message RecordResponse {
  MedicalRecord record = 1;
}

// ---------- Belge ----------

message Document {
  string id = 1;
  string pet_id = 2;
  string clinic_id = 3;
  string storage_path = 4;
  string original_name = 5;
  string mime_type = 6;
  int32 size_bytes = 7;
  string sha256 = 8;
  string note = 9;
  DocumentStatus status = 10;
  string failure_reason = 11;
  string draft_review_id = 12;
  string created_at = 13;
  string updated_at = 14;
}

message RegisterDocumentRequest {
  string pet_id = 1;
  string storage_path = 2;
  string original_name = 3;
  string mime_type = 4;
  int32 size_bytes = 5;
  string sha256 = 6;
  string note = 7;
}

message GetDocumentRequest {
  string id = 1;
}

message DocumentResponse {
  Document document = 1;
}

message ListDocumentsByPetRequest {
  string pet_id = 1;
  optional DocumentStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ---------- Aşı ----------

message Vaccination {
  string id = 1;
  string record_id = 2;
  string pet_id = 3;
  string vaccine_name = 4;
  string batch_number = 5;
  string administered_at = 6;     // ISO-8601
  string next_due_at = 7;         // ISO-8601, yoksa boş string
  string clinic_id = 9;

  reserved 8;
  reserved "veterinarian_user_id";
}

message ListVaccinationsRequest {
  string pet_id = 1;
  optional bool only_upcoming = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListVaccinationsResponse {
  repeated Vaccination vaccinations = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ---------- Reçete ----------
message Prescription {
  string id = 1;
  string record_id = 2;
  string pet_id = 3;
  string medication_name = 4;
  string dosage = 5;              // "250 mg"
  string frequency = 6;           // "günde 2 kez"
  int32 duration_days = 7;
  string instructions = 8;
  string prescribed_at = 9;       // ISO-8601
  string clinic_id = 11;

  reserved 10;
  reserved "veterinarian_user_id";
}

message ListPrescriptionsRequest {
  string pet_id = 1;
  optional bool only_active = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListPrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ---------- Tahlil ----------

message LabResult {
  string id = 1;
  string record_id = 2;
  string pet_id = 3;
  string clinic_id = 4;
  string test_name = 5;
  string value = 6;
  string unit = 7;
  string reference_range = 8;
  LabResultFlag flag = 9;
  string sampled_at = 10;
}

message ListLabResultsRequest {
  string pet_id = 1;
  optional string test_name = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListLabResultsResponse {
  repeated LabResult lab_results = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message LabExplanationItem {
  string test_name = 1;
  string explanation = 2;
}

message LabExplanation {
  string summary = 1;
  repeated LabExplanationItem items = 2;
}

message GetLabExplanationRequest {
  string record_id = 1;
}

message LabExplanationResponse {
  LabExplanationStatus status = 1;
  string summary = 2;
  repeated LabExplanationItem items = 3;
  double confidence = 4;
  string generated_at = 5;
}

// ---------- Sağlık değerlendirmesi (Akış C) ----------

message HealthFinding {
  string test_name = 1;
  LabTrend trend = 2;               // AI servisi ön analizden yazar, model üretmez
  string interpretation = 3;
}

message PossibleCondition {
  string name = 1;
  ConditionLikelihood likelihood = 2;
  repeated string evidence = 3;     // girdideki test adları
  string explanation = 4;
}

message HealthRecommendation {
  RecommendationCategory category = 1;
  string text = 2;
}

message VaccinationReminder {
  string vaccine_name = 1;
  string next_due_at = 2;           // YYYY-MM-DD
  VaccinationDueStatus status = 3;
}

message HealthAssessment {
  string summary = 1;
  HealthRiskLevel risk_level = 2;
  repeated HealthFinding findings = 3;
  repeated PossibleCondition possible_conditions = 4;
  repeated HealthRecommendation recommendations = 5;
  repeated VaccinationReminder vaccination_reminders = 6;
  repeated string questions_for_vet = 7;
}

message RequestHealthAssessmentRequest {
  string pet_id = 1;
}

message GetLatestHealthAssessmentRequest {
  string pet_id = 1;
}

// assessment, confidence ve generated_at yalnızca READY durumunda doludur.
message HealthAssessmentResponse {
  HealthAssessmentStatus status = 1;
  HealthAssessment assessment = 2;
  double confidence = 3;
  string requested_at = 4;          // ISO-8601
  string generated_at = 5;          // ISO-8601
  bool is_stale = 6;
}

// ---------- Klinik onayı (human-in-the-loop) ----------

// AI'ın ürettiği taslak. Klinik onaylamadan kalıcı kayda DÖNÜŞMEZ.
message DraftReview {
  string id = 1;
  string pet_id = 2;
  string clinic_id = 3;
  repeated FileReference source_files = 8;
  DraftReviewStatus status = 9;
  string review_note = 11;
  string created_record_id = 12;      // onaylanınca oluşan kaydın id'si
  string created_at = 13;             // ISO-8601
  string reviewed_at = 14;            // ISO-8601
  string reviewed_by_clinic_id = 15;
  string document_id = 16;
  RecordContent proposal = 17;
  RecordContent approved_content = 18;
  string model_version = 19;
  double confidence = 20;

  reserved 4, 5, 6, 7, 10;
  reserved "proposed_type", "proposed_title", "proposed_notes", "reviewed_by_user_id";
}

message ListDraftReviewsRequest {
  optional string pet_id = 1;         // boşsa kliniğin tamamı
  optional DraftReviewStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListDraftReviewsResponse {
  repeated DraftReview draft_reviews = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// reviewed_by_clinic_id YOK, klinik JWT'den alınır.
// İstemciden gelseydi bir klinik başkasının adına onay verebilirdi.
message ReviewDraftRequest {
  string id = 1;
  bool approved = 2;                  // false ise reddedilir
  string review_note = 3;
  // Klinik taslağı düzelterek onaylayabilir:
  RecordContent edited_content = 6;

  reserved 4, 5;
  reserved "edited_title", "edited_notes";
}

message DraftReviewResponse {
  DraftReview draft_review = 1;
}
