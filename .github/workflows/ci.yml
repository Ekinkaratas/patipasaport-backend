name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"

      - run: npx nx run-many -t lint build typecheck

      - run: npx nx fix-ci
        if: always()

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            apps/ai-service/requirements-dev.txt
            apps/ai-service/constraints.txt

      - run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - run: python -m ruff check .

      - run: python -m coverage run -m pytest

      - run: python -m coverage report

      - run: docker build -t patipasaport/ai-service:ci .
