# ============================================================
# İlk kurulum:
#   cp .env.example .env        
#   docker compose build        
#   docker compose up -d
#   curl http://localhost:3000/health
#
# Mimari:
#   gateway (HTTP :3000, tek dış kapı)
#   ─ gRPC ─> access:3001 | auth:3002 | clinics:3003
#                medical-record:3004 | pets:3005 | users:3006
#   Her mikroservisin kendi veritabanı var (database-per-service).
# ============================================================

# ---------- Ortak Parçalar ----------

x-app-common: &app-common
  init: true                  
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-grpc-healthcheck: &grpc-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

x-db-healthcheck: &db-healthcheck
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:

  # ============================================================
  # ALTYAPI
  # ============================================================

  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      <<: *db-healthcheck

  postgres-users:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-users_user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_user} -d ${USERS_DB_NAME:-users_db}"]
      <<: *db-healthcheck

  postgres-clinics:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${CLINICS_DB_USER:-clinics_user}
      POSTGRES_PASSWORD: ${CLINICS_DB_PASSWORD:?CLINICS_DB_PASSWORD}
      POSTGRES_DB: ${CLINICS_DB_NAME:-clinics_db}
    volumes:
      - pg_clinics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLINICS_DB_USER:-clinics_user} -d ${CLINICS_DB_NAME:-clinics_db}"]
      <<: *db-healthcheck

  postgres-access:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${ACCESS_DB_USER:-access_user}
      POSTGRES_PASSWORD: ${ACCESS_DB_PASSWORD:?ACCESS_DB_PASSWORD}
      POSTGRES_DB: ${ACCESS_DB_NAME:-access_db}
    volumes:
      - pg_access_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCESS_DB_USER:-access_user} -d ${ACCESS_DB_NAME:-access_db}"]
      <<: *db-healthcheck

  postgres-medical-record:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${MEDICAL_DB_USER:-medical_user}
      POSTGRES_PASSWORD: ${MEDICAL_DB_PASSWORD:?MEDICAL_DB_PASSWORD}
      POSTGRES_DB: ${MEDICAL_DB_NAME:-medical_db}
    volumes:
      - pg_medical_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDICAL_DB_USER:-medical_user} -d ${MEDICAL_DB_NAME:-medical_db}"]
      <<: *db-healthcheck

  postgres-pets:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${PETS_DB_USER:-pets_user}
      POSTGRES_PASSWORD: ${PETS_DB_PASSWORD:?PETS_DB_PASSWORD}
      POSTGRES_DB: ${PETS_DB_NAME:-pets_db}
    volumes:
      - pg_pets_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PETS_DB_USER:-pets_user} -d ${PETS_DB_NAME:-pets_db}"]
      <<: *db-healthcheck

  redis-access:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD}"]
    volumes:
      - redis_access_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      <<: *db-healthcheck

  redis-auth:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD}"]
    volumes:
      - redis_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${AUTH_REDIS_PASSWORD}", "ping"]
      <<: *db-healthcheck

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [backend]
    command: server -dir=/data -s3 -filer.encryptVolumeData
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && nc -z 127.0.0.1 8888"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    networks: [backend]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-medical-documents}
      S3_GATEWAY_ACCESS_KEY: ${S3_GATEWAY_ACCESS_KEY}
      S3_GATEWAY_SECRET_KEY: ${S3_GATEWAY_SECRET_KEY}
      S3_AI_ACCESS_KEY: ${S3_AI_ACCESS_KEY}
      S3_AI_SECRET_KEY: ${S3_AI_SECRET_KEY}
    volumes:
      - ./tools/seaweedfs/init.sh:/init/init.sh:ro
    depends_on:
      seaweedfs: { condition: service_healthy }

  # ============================================================
  # gRPC Mikroservisler (apps/*)
  # Dışarıya port açılmaz; sadece gateway backend ağından erişir.
  # ============================================================

  access:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: access }
    image: patipasaport/access:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_private
      - access_jwt_public
    environment:
      DB_HOST: postgres-access
      DB_PORT: "5432"
      DB_USER: ${ACCESS_DB_USER:-access_user}
      DB_PASSWORD: ${ACCESS_DB_PASSWORD}
      DB_NAME: ${ACCESS_DB_NAME:-access_db}
      REDIS_HOST: redis-access
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_GRPC_URL: auth:3002
      CLINICS_GRPC_URL: clinics:3003
      PETS_GRPC_URL: pets:3005
      JWT_PRIVATE_KEY_PATH: /run/secrets/access_jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3001"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-access: { condition: service_healthy }
      redis-access:    { condition: service_healthy }

  auth:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: auth }
    image: patipasaport/auth:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_public
    environment:
      DB_HOST: postgres-auth
      DB_PORT: "5432"
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      REDIS_HOST: redis-auth
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD}
      ACCESS_GRPC_URL: access:3001
      USERS_GRPC_URL: users:3006
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3002"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-auth: { condition: service_healthy }
      redis-auth:    { condition: service_healthy }

  clinics:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: clinics }
    image: patipasaport/clinics:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_public
    environment:
      DB_HOST: postgres-clinics
      DB_PORT: "5432"
      DB_USER: ${CLINICS_DB_USER:-clinics_user}
      DB_PASSWORD: ${CLINICS_DB_PASSWORD}
      DB_NAME: ${CLINICS_DB_NAME:-clinics_db}
      AUTH_GRPC_URL: auth:3002
      MEDICAL_RECORD_GRPC_URL: medical-record:3004
      PETS_GRPC_URL: pets:3005
      USERS_GRPC_URL: users:3006
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3003"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-clinics: { condition: service_healthy }

  medical-record:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: medical_record }
    image: patipasaport/medical-record:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_public
    environment:
      DB_HOST: postgres-medical-record
      DB_PORT: "5432"
      DB_USER: ${MEDICAL_DB_USER:-medical_user}
      DB_PASSWORD: ${MEDICAL_DB_PASSWORD}
      DB_NAME: ${MEDICAL_DB_NAME:-medical_db}
      ACCESS_GRPC_URL: access:3001
      PETS_GRPC_URL: pets:3005
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3004"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-medical-record: { condition: service_healthy }
      rabbitmq:                { condition: service_healthy }

  pets:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: pets }
    image: patipasaport/pets:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_public
    environment:
      DB_HOST: postgres-pets
      DB_PORT: "5432"
      DB_USER: ${PETS_DB_USER:-pets_user}
      DB_PASSWORD: ${PETS_DB_PASSWORD}
      DB_NAME: ${PETS_DB_NAME:-pets_db}
      ACCESS_GRPC_URL: access:3001
      PETS_CHIP_ENCRYPTION_KEY: ${PETS_CHIP_ENCRYPTION_KEY}
      PETS_CHIP_INDEX_KEY: ${PETS_CHIP_INDEX_KEY}
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3005"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-pets: { condition: service_healthy }

  users:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: users }
    image: patipasaport/users:${IMAGE_TAG:-latest}
    secrets:
      - access_jwt_public
    environment:
      DB_HOST: postgres-users
      DB_PORT: "5432"
      DB_USER: ${USERS_DB_USER:-users_user}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_NAME: ${USERS_DB_NAME:-users_db}
      ACCESS_GRPC_URL: access:3001
      JWT_PUBLIC_KEY_PATH: /run/secrets/access_jwt_public
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3006"]
      <<: *grpc-healthcheck
    depends_on:
      postgres-users: { condition: service_healthy }

  # ============================================================
  # GATEWAY (HTTP)
  # ============================================================

  gateway:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: gateway }
    image: patipasaport/gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      ACCESS_GRPC_URL:         access:3001
      AUTH_GRPC_URL:           auth:3002
      CLINICS_GRPC_URL:        clinics:3003
      MEDICAL_RECORD_GRPC_URL: medical-record:3004
      PETS_GRPC_URL:           pets:3005
      USERS_GRPC_URL:          users:3006
      S3_ENDPOINT:             http://seaweedfs:8333
      S3_BUCKET:               ${S3_BUCKET:-medical-documents}
      S3_ACCESS_KEY:           ${S3_GATEWAY_ACCESS_KEY}
      S3_SECRET_KEY:           ${S3_GATEWAY_SECRET_KEY}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      access:         { condition: service_healthy }
      auth:           { condition: service_healthy }
      clinics:        { condition: service_healthy }
      medical-record: { condition: service_healthy }
      pets:           { condition: service_healthy }
      users:          { condition: service_healthy }

# ============================================================

networks:
  backend:
    driver: bridge

volumes:
  pg_auth_data:
  pg_users_data:
  pg_clinics_data:
  pg_access_data:
  pg_medical_data:
  pg_pets_data:
  redis_access_data:
  redis_auth_data:
  rabbitmq_data:
  seaweedfs_data:

# Docker secret'i /run/secrets/<secret_adi> olarak mount eder — dosya adindaki
# .pem uzantisi konteynere TASINMAZ. Servisin environment: blogundaki
# JWT_*_KEY_PATH degerleri bu yuzden uzantisizdir.
#
# LINUX SUNUCU NOTU: non-swarm compose'da secret dosyasinin izinleri host'taki
# dosyadan gelir; long-syntax'taki uid/gid/mode yok sayılıyordu.
# Konteyner "USER node" (uid 1000) ile calistigi icin ozel anahtar root'a ait
# 0600 ise okunamaz ve servis ayaga kalkmaz. Sunucuda bir kez aşağıdaki termnial kodunu çalıştırarak düzeltebilirsiniz:
#   chown 1000:1000 access_jwt_private.pem && chmod 400 access_jwt_private.pem
secrets:
  access_jwt_private:
    file: ./access_jwt_private.pem
  access_jwt_public:
    file: ./access_jwt_public.pem
