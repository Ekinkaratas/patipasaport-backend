[project]
name = "patipasaport-ai-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["app/generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: ana proje dev modundayken gerçek RabbitMQ ile çalışan testler",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
